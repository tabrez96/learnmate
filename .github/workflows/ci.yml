name: CI
on:
  pull_request:
  push:
    branches: [develop]
jobs:
  server:
    runs-on: ubuntu-latest
    env:
      EMBED_CACHE_DIR: /home/runner/.cache/fastembed
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('server/learnmate/config.py') }}
          restore-keys: fastembed-
      - run: pip install -e ".[dev]"
      - run: ruff format --check . && ruff check .
      - run: pytest
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck testDebugUnitTest
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
