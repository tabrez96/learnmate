    icon: flask
    materials:
      - title: Science textbook
        chapters:
          - name: Nutrition in Plants
            pages:
              - text: |
                  Chapter 3: Nutrition in Plants

                  How Plants Get Food
                  Plants make their own food, so they are called autotrophs. Animals cannot do this and depend on plants or on other animals, so they are called heterotrophs.
                  The food is made in the green parts of a plant, mostly in the leaves. The leaf is a kitchen: the raw materials go in, and sugar comes out.
                  The raw materials are carbon dioxide from the air, water from the soil, and sunlight.
              - text: |
                  Photosynthesis

                  The process by which a plant makes sugar from carbon dioxide and water is called photosynthesis. It needs light, so it happens in the daytime.
                  Leaves contain a green pigment called chlorophyll. Chlorophyll traps the energy of sunlight and uses it to join carbon dioxide and water into glucose. Oxygen is released as a by-product.
                  Extra glucose is stored as starch. A simple test with iodine solution turns a leaf with starch blue-black. A leaf kept in the dark for some days shows no starch.
              - text: |
                  Other Ways of Feeding

                  Roots absorb water and minerals such as nitrates from the soil. Water travels up the stem to the leaves through thin tubes called xylem.
                  Some plants do not make their own food. Cuscuta, also called dodder, is a yellow climbing plant with no leaves. It takes ready-made food from the plant it grows on, so it is a parasite.
                  Pitcher plants grow in soil that lacks nitrogen. They trap insects inside a jug-shaped leaf and digest them to get the missing nitrogen.
                  Fungi such as mushrooms feed on dead and rotting matter and are called saprotrophs.
          - name: Heat and Temperature
            pages:
              - text: |
                  Chapter 4: Heat and Temperature

                  Hot and Cold
                  Temperature tells us how hot or cold an object is. Heat is the energy that moves from a hotter object to a colder one. We measure temperature with a thermometer, in degrees Celsius.
                  A clinical thermometer is used to measure the temperature of the human body. Its scale runs from 35 to 42 degrees Celsius, and normal body temperature is about 37 degrees Celsius. A small kink near the bulb stops the mercury from sliding back, so the reading stays after the thermometer leaves the mouth.
                  A laboratory thermometer reads from minus 10 to 110 degrees Celsius.
              - text: |
                  Transfer of Heat

                  Heat travels in three ways. In conduction, heat passes through a solid from the hot end to the cold end without the material moving. A metal spoon left in hot tea becomes hot at the handle. Metals are good conductors; wood and plastic are poor conductors, called insulators.
                  In convection, heat is carried by the movement of a liquid or gas. Warm water rises and cooler water sinks, setting up a current.
                  In radiation, heat travels without any material between the objects. This is how warmth from the Sun reaches the Earth through empty space.
                  Dark objects absorb more radiation than light objects, so people prefer white clothes in summer.
