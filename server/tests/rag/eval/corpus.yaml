  - name: Civics
    icon: scale
    materials:
      - title: Civics textbook
        chapters:
          - name: Fundamental Rights
            pages:
              - text: |
                  Chapter 5: Fundamental Rights

                  Rights in the Constitution
                  The Constitution of India guarantees certain basic rights to every person. These are called Fundamental Rights because they are essential for a good life and are protected by the courts. If a right is violated, a citizen can go to the High Court or the Supreme Court.
                  There are six groups of Fundamental Rights: the Right to Equality, the Right to Freedom, the Right against Exploitation, the Right to Freedom of Religion, Cultural and Educational Rights, and the Right to Constitutional Remedies.
              - text: |
                  Equality and Freedom

                  Article 14 says that all persons are equal before the law, and the law protects everyone equally. A rich landowner and a farm worker stand in the same position before a judge.
                  Article 15 forbids discrimination on grounds of religion, race, caste, sex or place of birth. Article 17 abolishes untouchability.
                  Article 19 gives citizens the freedom of speech and expression, the freedom to form associations and the freedom to move freely throughout the country. These freedoms come with reasonable limits so that one person's freedom does not harm another.
              - text: |
                  Life, Exploitation and Remedies

                  Article 21 protects life and personal liberty. No person can be deprived of life or liberty except by a procedure set out in law. The Supreme Court has said that this includes the right to live with dignity, and Article 21A makes education a right for children aged six to fourteen.
                  Article 23 bans forced labour and the trafficking of human beings, and Article 24 forbids employing children under fourteen in factories or mines.
                  Article 32 allows a person to go straight to the Supreme Court when a fundamental right is violated. Dr. B. R. Ambedkar called it the heart and soul of the Constitution.
          - name: Local Government
            pages:
              - text: |
                  Chapter 6: Local Government

                  Why We Need Local Government
                  Many problems, such as a broken street light or a blocked drain, are best solved close to the people. Local government is the level of government nearest to the citizen. In villages it is run by the panchayat and in towns by the municipality.
                  The village panchayat is headed by the sarpanch, who is elected by the voters of the village. The Gram Sabha is the meeting of all adult residents of the village. It approves the budget and checks the work of the panchayat. It meets at least twice a year.
              - text: |
                  Towns and Cities

                  A town is divided into wards, and the people of each ward elect a ward councillor. The councillors together form the municipal council, which looks after water supply, roads, street lighting, waste collection and public health. In a large city, the council is led by a mayor.
                  Local bodies raise money through house tax, water charges and market fees, and also receive grants from the state government. One third of the seats in local bodies are kept for women, so that more women take part in decisions about their own neighbourhoods.
