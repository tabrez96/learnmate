[project]
name = "learnmate"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "python-telegram-bot>=22.0,<23",
  "python-multipart>=0.0.20",
  "anthropic>=0.60",
  "pypdf>=6",
  "pypdfium2>=5",
  "python-docx>=1.2",
  "pillow>=12",
  "fastembed>=0.7",
  "numpy>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["learnmate*"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Defaults plus import sorting (I), pyupgrade (UP) and bugbear (B).
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
